<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>pinch during fling</title>
<style>
body{margin:0;font:14px system-ui}
#log{position:fixed;top:0;left:0;right:0;height:38vh;overflow:auto;background:#111;color:#0f0;font:12px monospace;z-index:2;white-space:pre}
#scroller{position:fixed;top:38vh;bottom:0;left:0;right:0;overflow:auto;touch-action:pan-x pan-y}
.page{height:900px;margin:12px;background:linear-gradient(#eef,#ccf);border:1px solid #88a}
</style></head><body>
<div id="log"></div>
<div id="scroller"></div>
<script>
const scroller = document.getElementById("scroller");
const log = document.getElementById("log");
for (let i = 0; i < 40; i++) {
  const page = document.createElement("div");
  page.className = "page";
  page.textContent = `page ${i + 1}`;
  scroller.append(page);
}
const t0 = performance.now();
let lastScroll = 0;
let scrolls = 0;
const out = (line) => {
  log.textContent = `${Math.round(performance.now() - t0)} ${line}\n${log.textContent}`;
};
const sinceScroll = () => Math.round(performance.now() - lastScroll);
scroller.addEventListener(
  "scroll",
  () => {
    scrolls++;
    lastScroll = performance.now();
  },
  { passive: true },
);
setInterval(() => {
  if (!scrolls) return;
  out(`scroll x${scrolls} top=${Math.round(scroller.scrollTop)}`);
  scrolls = 0;
}, 250);
for (const type of ["touchstart", "touchend", "touchcancel"]) {
  scroller.addEventListener(
    type,
    (event) =>
      out(
        `${type} touches=${event.touches.length} changed=${event.changedTouches.length} sinceScroll=${sinceScroll()}`,
      ),
    { passive: true },
  );
}
let moves = 0;
scroller.addEventListener(
  "touchmove",
  (event) => {
    if (event.touches.length > 1 || ++moves % 10 === 1) out(`touchmove touches=${event.touches.length}`);
  },
  { passive: true },
);
for (const type of ["gesturestart", "gesturechange", "gestureend"]) {
  scroller.addEventListener(type, (event) => {
    if (type !== "gesturechange" || Math.random() < 0.2) out(`${type} scale=${event.scale.toFixed(2)}`);
  });
}
for (const type of ["pointerdown", "pointercancel"]) {
  scroller.addEventListener(type, (event) => out(`${type} id=${event.pointerId}`));
}
out("ready");
</script></body></html>
