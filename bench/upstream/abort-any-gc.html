<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>AbortSignal.any() listeners after GC</title>
</head><body>
<pre id="out">Running, about 20 seconds…</pre>
<script>
// Each round adds 500 window listeners with the signal AbortSignal.any()
// returns for [root.signal, controller.signal], one controller per
// listener, and 500 more whose signals are also kept in an array. It then
// waits three seconds (the engine collects garbage in between), aborts every
// controller, dispatches one event of each type, and counts the listeners
// that still ran. Expected: 0 in every line.
const params = new URLSearchParams(location.search);
const rounds = Number(params.get("rounds") ?? 6);
const ticks = Number(params.get("ticks") ?? 300);
const alloc = Number(params.get("alloc") ?? 0);
const count = 500;
const out = document.getElementById("out");

function add(type, keep, root, controllers, kept, counter) {
  for (let i = 0; i < count; i++) {
    const controller = new AbortController();
    const signal = AbortSignal.any([root.signal, controller.signal]);
    window.addEventListener(type, () => counter.called++, { signal });
    controllers.push(controller);
    if (keep) kept.push(signal);
  }
}

async function wait() {
  for (let i = 0; i < ticks; i++) {
    let junk = [];
    for (let j = 0; j < alloc; j++) junk.push({ j });
    junk = null;
    await new Promise((resolve) => setTimeout(resolve, 10));
  }
}

async function round(n) {
  const root = new AbortController();
  const controllers = [];
  const kept = [];
  const unreferenced = { called: 0 };
  const referenced = { called: 0 };
  add(`unreferenced-${n}`, false, root, controllers, kept, unreferenced);
  add(`referenced-${n}`, true, root, controllers, kept, referenced);
  await wait();
  for (const controller of controllers) controller.abort();
  window.dispatchEvent(new Event(`unreferenced-${n}`));
  window.dispatchEvent(new Event(`referenced-${n}`));
  const aborted = kept.filter((signal) => signal.aborted).length;
  return `round ${n}: ${unreferenced.called} of ${count} listeners ran (signals unreferenced), ` +
    `${referenced.called} of ${count} (signals kept, ${aborted} report aborted)`;
}

(async () => {
  const lines = [];
  for (let n = 1; n <= rounds; n++) {
    lines.push(await round(n));
    out.textContent = `${lines.join("\n")}\nRunning…`;
  }
  lines.push("", "Expected: 0 listeners ran in every round.", navigator.userAgent);
  out.textContent = lines.join("\n");
  document.title = "done";
})();
</script>
</body></html>
