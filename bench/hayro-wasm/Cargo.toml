[package]
name = "hayro-wasm-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "Minimal wasm-bindgen wrapper around hayro for the ParaPDF engine benchmark"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pin the engine under test; the default features embed Standard 14 fonts and CMaps.
hayro = "=0.8.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--all-features"]
