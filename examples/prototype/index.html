<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ParaPDF prototype</title>
    <style>
      html, body, #root { margin: 0; height: 100%; }
      body { font: 13px system-ui, sans-serif; color: #e8e8e8; background: #3b3d40; }
      .toolbar {
        position: absolute; inset: 0 0 auto 0; height: 40px; display: flex; gap: 12px;
        align-items: center; padding: 0 12px; background: #2a2b2e; box-sizing: border-box;
      }
      .toolbar button { min-width: 28px; }
      .toolbar .engine { color: #9aa0a6; }
      .viewport { position: absolute; inset: 40px 0 0 0; background: #525659; }
      .status { padding: 16px; }
      .search { display: flex; gap: 4px; align-items: center; margin-left: auto; }
      .search input { width: 200px; }
      .search-summary { min-width: 9em; color: #c9cdd2; }
      .viewport.with-sidebar { left: 280px; }
      .sidebar {
        position: absolute; inset: 40px auto 0 0; width: 280px; overflow: auto;
        background: #2f3134; box-sizing: border-box; padding: 8px 4px;
      }
      .sidebar ul, .sidebar ol { list-style: none; margin: 0; padding-left: 12px; }
      .sidebar > ul, .sidebar > ol { padding-left: 0; }
      .outline :is(button, a), .attachments button {
        display: block; width: 100%; text-align: left; padding: 4px 8px; border: 0;
        background: none; color: #e8e8e8; font: inherit; cursor: pointer; border-radius: 4px;
      }
      .outline :is(button, a):hover, .outline :is(button, a):focus-visible,
      .attachments button:hover { background: #45484c; }
      .thumbnails li { display: flex; justify-content: center; padding: 6px 0; }
      .thumbnails button {
        display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px;
        border: 2px solid transparent; border-radius: 4px; background: none; color: #e8e8e8;
        font: inherit; cursor: pointer;
      }
      .thumbnails button[aria-current="page"] { border-color: #8ab4f8; }
      .layers label { display: flex; gap: 6px; align-items: center; padding: 4px 8px; }
      .layers .heading { display: block; padding: 4px 8px; color: #9aa0a6; }
      .password {
        position: absolute; inset: 40px 0 auto 0; z-index: 10; display: flex; gap: 8px;
        align-items: center; padding: 12px; background: #2a2b2e;
      }
      .password label { display: flex; gap: 8px; align-items: center; }
      .toolbar { overflow-x: auto; white-space: nowrap; }
      .annotation-toolbar { top: 40px; background: #303236; }
      .annotation-toolbar [aria-pressed="true"] { outline: 2px solid #8ab4f8; }
      .viewport.with-annotations { top: 80px; }
      .with-annotations ~ .sidebar, .sidebar:has(~ .with-annotations) { top: 80px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
