name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Lint, types, unit tests, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The benchmark's own typecheck needs its Rust build (pnpm bench:build).
      - run: pnpm --filter parapdf --filter @parapdf/prototype --filter @parapdf/site typecheck
      - run: pnpm test
      - run: pnpm --filter parapdf check:package
      # Reads the demo's build, not a browser.
      - run: pnpm --filter @parapdf/prototype check:modules

  browser:
    name: Functional checks in ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium
          - browser: webkit
            label: WebKit
          - browser: firefox
            label: Firefox
    env:
      BROWSER: ${{ matrix.browser }}
      # Released pdfjs-dist; the pdfjs-next engine needs a pdf.js master build.
      ENGINE: pdfjs
      # The browsers' console, page errors, and screenshots of failures
      # (bench/scripts/browsers.ts), uploaded when a check fails.
      DIAGNOSTICS: ${{ github.workspace }}/diagnostics
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parapdf/bench exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @parapdf/bench corpus
      - id: build
        run: pnpm --filter @parapdf/prototype build
      # Every check runs once the build is ready, so that one failure does not
      # hide another.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:text
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:links
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:lifecycle
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:viewers
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:rotation
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:options
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:pinch
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:features
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:scroll
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:annotations
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:document
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @parapdf/prototype check:bundle
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.browser }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  bundlers:
    name: Packaged assets in webpack, Rsbuild, and Next.js
    runs-on: ubuntu-latest
    env:
      BROWSER: chromium
      DIAGNOSTICS: ${{ github.workspace }}/diagnostics
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parapdf/bench exec playwright install --with-deps chromium
      - run: pnpm --filter @parapdf/bench corpus
      - run: pnpm --filter @parapdf/prototype check:bundlers
      # What each bundler built, beside the launcher's diagnostics.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-bundlers
          path: |
            diagnostics/
            examples/prototype/.bundlers/*/dist*/
            examples/prototype/.bundlers/*/.next/static/
          if-no-files-found: ignore
          retention-days: 14
