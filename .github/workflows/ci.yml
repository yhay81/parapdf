name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Lint, types, unit tests, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The benchmark's own typecheck needs its Rust build (pnpm bench:build).
      - run: pnpm --filter parapdf --filter @parapdf/prototype --filter @parapdf/site typecheck
      - run: pnpm test
      - run: pnpm --filter parapdf check:package

  browser:
    name: Functional checks in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      # Each browser's failures are its own; one never cancels the others.
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      BROWSER: ${{ matrix.browser }}
      # Released pdfjs-dist; the pdfjs-next engine needs a pdf.js master build.
      ENGINE: pdfjs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parapdf/bench exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @parapdf/bench corpus
      - run: pnpm --filter @parapdf/prototype build
      # Every check runs, also after one fails, and keeps its output in
      # logs/<check>.log; the step fails if any did.
      - if: matrix.browser == 'webkit'
        run: node examples/prototype/scripts/debug-search.ts
        timeout-minutes: 5
        continue-on-error: true
      - name: Functional checks
        timeout-minutes: 40
        run: |
          set -o pipefail
          mkdir -p logs
          failed=""
          for check in text links lifecycle viewers rotation options pinch features scroll annotations document bundle modules; do
            echo "::group::check:$check"
            if ! pnpm --filter @parapdf/prototype "check:$check" 2>&1 | tee "logs/$check.log"; then
              failed="$failed $check"
            fi
            echo "::endgroup::"
            grep -h "^FAIL" "logs/$check.log" | sed "s/^/::error title=check:$check::/" || true
          done
          if [ -n "$failed" ]; then
            echo "Failed in $BROWSER:$failed"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-checks-${{ matrix.browser }}
          path: logs/
