name: Release

# Publishes parapdf to npm through OIDC Trusted Publishing (with provenance)
# and creates the GitHub release from CHANGELOG.md when a v* tag is pushed.
# Configure npmjs.com -> parapdf -> Settings -> Trusted Publisher -> GitHub Actions:
#   Owner: yhay81, Repository: parapdf, Workflow filename: release.yml
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag on main (e.g. v0.9.1)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm and create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Verify the tag points to a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Ensure npm supports OIDC Trusted Publishing
        run: |
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            if (maj < 11 || (maj === 11 && (min < 5 || (min === 5 && pat < 1)))) process.exit(1);
          ' "$(npm --version)" || npm install -g npm@latest
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: Verify tag version and extract CHANGELOG notes
        run: node .github/scripts/release-notes.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
      - run: pnpm --filter parapdf check:package
      - name: Pack and publish to npm
        run: |
          VERSION="${RELEASE_TAG#v}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/parapdf/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "parapdf@${VERSION} is already on npm; skipping publish."
          else
            pnpm --filter parapdf pack --pack-destination "$RUNNER_TEMP"
            npm publish "$RUNNER_TEMP/parapdf-${VERSION}.tgz" --provenance --access public
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="parapdf ${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
